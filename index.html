<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزرعة الخضار</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a9a3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مزرعة الخضار">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3efe3;--card:#fffdf6;--tx:#2b2a22;--mut:#7a7561;--ac:#4a9a3c;--bd:#e2dcc5;--soil:#8a5a35;--soil2:#a06c40;--gold:#e0a21b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d18;--card:#262920;--tx:#f1eedd;--mut:#a6a28b;--bd:#3a3d2f;--soil:#5e3d24;--soil2:#74492b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin:0 auto;padding:0 10px 24px}
#sky{border-radius:0 0 22px 22px;padding:12px 14px 14px;color:#fff;position:relative;overflow:hidden;transition:background 1s;text-shadow:0 1px 3px #0005}
#sky .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#0004;border-radius:99px;padding:5px 12px;font-weight:700;font-size:15px}
#orb{position:absolute;font-size:34px;top:6px;left:50%;transform:translateX(-50%)}
#xp{height:8px;background:#0004;border-radius:9px;margin-top:10px;overflow:hidden}
#xpb{height:100%;background:#ffd84a;width:0}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soil);padding:10px;border-radius:16px}
.plot{aspect-ratio:1;background:var(--soil2);border:2px dashed #0003;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;cursor:pointer;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.plot.rdy{border:2px solid #ffd84a;animation:p 1s infinite alternate}
@keyframes p{to{transform:scale(1.05)}}
.plot small{font-size:11px;color:#fff;position:absolute;bottom:4px}
.bar{position:absolute;bottom:18px;left:12%;right:12%;height:5px;background:#0004;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#7ddc5a}
.seeds{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.seed{flex:0 0 auto;min-width:68px;text-align:center;border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:6px 4px;font-size:26px;cursor:pointer;color:var(--tx)}
.seed small{display:block;font-size:11px;color:var(--mut)}
.seed.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--card))}
.seed.lock{opacity:.4}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.item .e{font-size:30px}.item .t{flex:1;font-size:14px}.item .t b{display:block}.item .t span{color:var(--mut);font-size:12px}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}.btn.g{background:var(--gold)}
h3{margin:0 0 8px;font-size:16px}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222e;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}
.reset{display:block;margin:14px auto 0;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="sky">
  <div id="orb">☀️</div>
  <div class="row"><span class="pill" id="coins"></span><span class="pill" id="clock"></span><span class="pill" id="lvl"></span></div>
  <div id="xp"><div id="xpb"></div></div>
</div>
<div class="tabs"><button data-t="farm" class="on">🌾 المزرعة</button><button data-t="shop">🏪 المتجر</button><button data-t="ord">📋 الطلبات</button></div>
<div id="farm"><div class="seeds" id="seeds"></div><div id="grid"></div><p style="color:var(--mut);font-size:12px;text-align:center">اضغط على الأرض لزرع البذرة المختارة، واضغط على المحصول الناضج لحصاده</p></div>
<div id="shop" hidden></div>
<div id="ord" hidden></div>
<button class="reset" id="rs">إعادة اللعبة من البداية</button>
<div id="toast"></div>
<script>
const C={carrot:{e:'🥕',n:'جزر',cost:5,t:15,p:12,lv:1},tomato:{e:'🍅',n:'طماطم',cost:10,t:30,p:24,lv:1},potato:{e:'🥔',n:'بطاطس',cost:14,t:45,p:34,lv:2},cucumber:{e:'🥒',n:'خيار',cost:20,t:60,p:50,lv:3},corn:{e:'🌽',n:'ذرة',cost:28,t:90,p:72,lv:4},eggplant:{e:'🍆',n:'باذنجان',cost:40,t:120,p:105,lv:5},pepper:{e:'🌶️',n:'فلفل',cost:55,t:150,p:145,lv:6},broccoli:{e:'🥦',n:'بروكلي',cost:75,t:200,p:200,lv:8}};
const KEYS=Object.keys(C),SK='veggie_farm_v1',DAY=240;
const $=id=>document.getElementById(id);
const fresh=()=>({coins:50,xp:0,inv:{},plots:Array(6).fill(null),orders:[],seed:'carrot',t0:Date.now()});
let S;try{S=JSON.parse(localStorage.getItem(SK))}catch(e){}
if(!S||!S.plots)S=fresh();
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
const lvl=()=>Math.floor(S.xp/100)+1;
const avail=()=>KEYS.filter(k=>C[k].lv<=lvl());
function toast(m){const t=$('toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',1600)}
function mkOrder(){const a=avail(),n=Math.min(a.length,1+Math.floor(Math.random()*3)),pick=[...a].sort(()=>Math.random()-.5).slice(0,n),need={};let v=0;
 pick.forEach(k=>{const q=1+Math.floor(Math.random()*(2+Math.min(3,lvl())));need[k]=q;v+=q*C[k].p});
 return{need,reward:Math.round(v*1.5),xp:Math.round(v/6)+5}}
while(S.orders.length<3)S.orders.push(mkOrder());
function phase(){const d=((Date.now()-S.t0)/1000)%DAY,h=(6+d/DAY*24)%24;return{h,night:h>=19||h<5.5}}
function sky(){const{h,night}=phase(),hh=Math.floor(h),mm=Math.floor((h%1)*60);
 $('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
 let g;if(night)g='linear-gradient(#0d1530,#2a2f6b)';else if(h<8||h>17)g='linear-gradient(#f0845c,#ffc77a)';else g='linear-gradient(#3d9be0,#8fd3ff)';
 $('sky').style.background=g;$('orb').textContent=night?'🌙':'☀️';
 const p=night?((h>=19?h-19:h+5)/10.5):((h-5.5)/13.5);$('orb').style.left=(10+p*80)+'%';$('orb').style.top=(8+Math.abs(p-.5)*36)+'px'}
function hud(){$('coins').textContent='🪙 '+S.coins;$('lvl').textContent='⭐ مستوى '+lvl();$('xpb').style.width=(S.xp%100)+'%'}
function seeds(){$('seeds').innerHTML=KEYS.map(k=>{const c=C[k],lk=c.lv>lvl();return`<div class="seed ${S.seed===k?'on':''} ${lk?'lock':''}" data-k="${k}">${lk?'🔒':c.e}<small>${lk?'مستوى '+c.lv:c.n+' · '+c.cost+'🪙'}</small></div>`}).join('')}
function grid(){$('grid').innerHTML=S.plots.map((p,i)=>{if(!p)return`<div class="plot" data-i="${i}">➕</div>`;const c=C[p.c],pr=Math.min(1,(Date.now()-p.at)/(c.t*1000));
 if(pr>=1)return`<div class="plot rdy" data-i="${i}">${c.e}<small>احصد!</small></div>`;
 const left=Math.ceil(c.t*(1-pr));return`<div class="plot" data-i="${i}">${pr<.4?'🌱':'🌿'}<div class="bar"><i style="width:${pr*100}%"></i></div><small>${left}ث</small></div>`}).join('')}
function shop(){const inv=KEYS.filter(k=>S.inv[k]>0),cost=100*(S.plots.length-5)**2;
 let h='<div class="card"><h3>🧺 بيع المحصول'+(phase().night?' (ليلاً +10%)':'')+'</h3>';
 h+=inv.length?inv.map(k=>{const pr=Math.round(C[k].p*(phase().night?1.1:1));return`<div class="item"><span class="e">${C[k].e}</span><div class="t"><b>${C[k].n} × ${S.inv[k]}</b><span>${pr}🪙 للواحدة</span></div><button class="btn g" data-s="${k}">بيع الكل</button></div>`}).join(''):'<p style="color:var(--mut);margin:0">لا يوجد محصول بعد، ازرع واحصد!</p>';
 h+='</div><div class="card"><h3>🏞️ توسيع المزرعة</h3>';
 h+=S.plots.length<12?`<div class="item"><span class="e">🟫</span><div class="t"><b>قطعة أرض جديدة</b><span>${S.plots.length} من 12</span></div><button class="btn" data-b="1" ${S.coins<cost?'disabled':''}>${cost}🪙</button></div>`:'<p style="margin:0">مزرعتك وصلت للحد الأقصى 🎉</p>';
 $('shop').innerHTML=h+'</div>'}
function ord(){$('ord').innerHTML=S.orders.map((o,i)=>{const ok=Object.keys(o.need).every(k=>(S.inv[k]||0)>=o.need[k]);
 return`<div class="card"><h3>طلب #${i+1}</h3>${Object.keys(o.need).map(k=>`<div class="item"><span class="e">${C[k].e}</span><div class="t"><b>${C[k].n}</b><span>${Math.min(S.inv[k]||0,o.need[k])} / ${o.need[k]}</span></div></div>`).join('')}<div class="item"><div class="t"><b>المكافأة: ${o.reward}🪙 + ${o.xp} خبرة</b></div><button class="btn g" data-o="${i}" ${ok?'':'disabled'}>تسليم</button></div></div>`}).join('')}
function all(){hud();seeds();grid();shop();ord();save()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],.seed,.plot,[data-s],[data-b],[data-o]');if(!t)return;
 if(t.dataset.t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t));['farm','shop','ord'].forEach(x=>$(x).hidden=x!==t.dataset.t);all();return}
 if(t.classList.contains('seed')){if(C[t.dataset.k].lv>lvl())return toast('🔒 يفتح في المستوى '+C[t.dataset.k].lv);S.seed=t.dataset.k}
 else if(t.classList.contains('plot')){const i=+t.dataset.i,p=S.plots[i];
  if(!p){const c=C[S.seed];if(S.coins<c.cost)return toast('عملاتك لا تكفي 🪙');S.coins-=c.cost;S.plots[i]={c:S.seed,at:Date.now()}}
  else if(Date.now()-p.at>=C[p.c].t*1000){S.inv[p.c]=(S.inv[p.c]||0)+1;const old=lvl();S.xp+=Math.ceil(C[p.c].p/5);S.plots[i]=null;toast('+1 '+C[p.c].e);if(lvl()>old)toast('🎉 مستوى جديد '+lvl())}}
 else if(t.dataset.s){const k=t.dataset.s;S.coins+=Math.round(S.inv[k]*C[k].p*(phase().night?1.1:1));S.inv[k]=0;toast('تم البيع 🪙')}
 else if(t.dataset.b){const cost=100*(S.plots.length-5)**2;if(S.coins>=cost){S.coins-=cost;S.plots.push(null)}}
 else if(t.dataset.o){const o=S.orders[+t.dataset.o];Object.keys(o.need).forEach(k=>S.inv[k]-=o.need[k]);S.coins+=o.reward;S.xp+=o.xp;S.orders[+t.dataset.o]=mkOrder();toast('✅ تم تسليم الطلب')}
 all()});
$('rs').onclick=()=>{if(confirm('حذف كل التقدم والبدء من جديد؟')){S=fresh();while(S.orders.length<3)S.orders.push(mkOrder());all()}};
setInterval(()=>{sky();if(!$('farm').hidden)grid()},1000);
sky();all();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
